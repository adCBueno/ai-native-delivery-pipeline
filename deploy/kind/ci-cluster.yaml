# kind cluster used by the deploy:smoke job. The cluster runs inside the
# docker-in-docker service, so the API server must listen on all
# interfaces and its certificate must be valid for the "docker" hostname.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - docker
            - localhost
            - 127.0.0.1
